\t\t\t\t}
\t\t\t}
\t\t\tentry := CuratedEntry{
\t\t\t\tID:               mutation.ID,
\t\t\t\tContent:          mutation.Content,
\t\t\t\tType:             NormalizeCuratedType(mutation.Type),
\t\t\t\tStatus:           CuratedStatusActive,
\t\t\t\tPinned:           mutation.migrationPinned,
\t\t\t\tConfidence:       DefaultConfidenceForEvidence(evidence),
''')
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\t\t\tProvenance:       mutation.Provenance,
\t\t\t\tCreatedAt:        now,
\t\t\t\tUpdatedAt:        now,
''',
              '''\t\t\t\tProvenance:       mutation.Provenance,
\t\t\t\tCreatedAt:        createdAt,
\t\t\t\tUpdatedAt:        updatedAt,
''')
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\t\tif entry.EvidenceCount == 0 {
\t\t\t\tentry.EvidenceCount = 1
\t\t\t}
\t\t\tif evidence == CuratedEvidenceObserved && entry.ObservationCount == 0 {
\t\t\t\tentry.ObservationCount = entry.EvidenceCount
