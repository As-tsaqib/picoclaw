name: Antigravity Hardening Bootstrap

on:
  push:
    branches:
      - fix/antigravity-hardening
    paths:
      - .github/workflows/antigravity-hardening-bootstrap.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export exact source
        run: |
          tar --exclude=.git -czf /tmp/picoclaw-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: picoclaw-hardening-source
          path: /tmp/picoclaw-source.tar.gz
          if-no-files-found: error
