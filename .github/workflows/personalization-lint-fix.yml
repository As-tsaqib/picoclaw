name: Personalization Lint Fix

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-lint-fix.yml

permissions:
  contents: write

jobs:
  format-lint-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Fix lint-only declarations
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_one(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"{label} not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_one(
              "pkg/agent/context_manager_test.go",
              '''\tif _, err := recall.AppendDeliveredTurn(
          \t\tcaller,
          \t\t"turn-pref",
          \t\t"Mulai sekarang saya lebih suka jawaban ringkas",
          \t\t"Baik.",
          \t\t"assistant-message",
          \t); err != nil {
          \t\tt.Fatal(err)
          \t}
          ''',
              '''\tif _, appendErr := recall.AppendDeliveredTurn(
          \t\tcaller,
          \t\t"turn-pref",
          \t\t"Mulai sekarang saya lebih suka jawaban ringkas",
          \t\t"Baik.",
          \t\t"assistant-message",
          \t); appendErr != nil {
          \t\tt.Fatal(appendErr)
          \t}
          ''',
              "AppendDeliveredTurn shadow block",
          )
          replace_one(
              "pkg/agent/context_manager_test.go",
              '''\tif err := al.contextManager.Compact(context.Background(), &CompactRequest{
          \t\tSessionKey: caller.SessionKey,
          \t\tReason:     ContextCompressReasonRetry,
          \t}); err != nil {
          \t\tt.Fatal(err)
          \t}
          ''',
              '''\tif compactErr := al.contextManager.Compact(context.Background(), &CompactRequest{
          \t\tSessionKey: caller.SessionKey,
          \t\tReason:     ContextCompressReasonRetry,
          \t}); compactErr != nil {
          \t\tt.Fatal(compactErr)
          \t}
          ''',
              "Compact shadow block",
          )
          replace_one(
              "cmd/membench/personalization.go",
              '''\t\tif _, err := store.Retrieve(memory.CuratedTargetCurrentUser, userA, memory.CuratedRetrievalOptions{
          \t\t\tQuery: query, MaxResults: 6, MaxChars: 2_800, PinnedChars: 800,
          \t\t\tMinimumScore: 0.35, RecencyWeight: 0.25, RecencyHalfLifeDays: 90,
          \t\t\tStaleAfterDays: 180, FuzzyWeight: 0.75, RecentFallbackCount: 0,
          \t\t}); err != nil {
          \t\t\treturn err
          \t\t}
          ''',
              '''\t\tif _, retrieveErr := store.Retrieve(memory.CuratedTargetCurrentUser, userA, memory.CuratedRetrievalOptions{
          \t\t\tQuery: query, MaxResults: 6, MaxChars: 2_800, PinnedChars: 800,
          \t\t\tMinimumScore: 0.35, RecencyWeight: 0.25, RecencyHalfLifeDays: 90,
          \t\t\tStaleAfterDays: 180, FuzzyWeight: 0.75, RecentFallbackCount: 0,
          \t\t}); retrieveErr != nil {
          \t\t\treturn retrieveErr
          \t\t}
          ''',
              "Retrieve shadow block",
          )
          replace_one(
              "pkg/memory/curated_schema.go",
              '''\tif max := maxConfidenceForEvidence(evidence); confidence > max {
          \t\treturn max
          \t}
          ''',
              '''\tif maxConfidence := maxConfidenceForEvidence(evidence); confidence > maxConfidence {
          \t\treturn maxConfidence
          \t}
          ''',
              "predeclared max block",
          )

          path = Path("pkg/memory/user_profile_test.go")
          text = path.read_text()
          pattern = re.compile(
              r'if _, err := store\.ApplyBatch\((.*?)\); err != nil \{\n\t\tt\.Fatal\(err\)\n\t\}',
              re.S,
          )
          text, count = pattern.subn(
              lambda m: 'if _, applyErr := store.ApplyBatch(' + m.group(1)
              + '); applyErr != nil {\n\t\tt.Fatal(applyErr)\n\t}',
              text,
          )
          if count < 4:
              raise SystemExit(f"expected at least 4 ApplyBatch shadow blocks, found {count}")
          path.write_text(text)

          path = Path("pkg/agent/memory_reviewer_test.go")
          text = path.read_text()
          replacements = [
              (
                  re.compile(
                      r'if _, err := recall\.AppendDeliveredTurn\((.*?)\); err != nil \{\n\t\tt\.Fatal\(err\)\n\t\}',
                      re.S,
                  ),
                  lambda m: 'if _, appendErr := recall.AppendDeliveredTurn(' + m.group(1)
                  + '); appendErr != nil {\n\t\tt.Fatal(appendErr)\n\t}',
              ),
              (
                  re.compile(
                      r'if _, err := reviewState\.RecordSuccessfulTurn\((.*?)\); err != nil \{\n\t\tt\.Fatal\(err\)\n\t\}',
                      re.S,
                  ),
                  lambda m: 'if _, recordErr := reviewState.RecordSuccessfulTurn(' + m.group(1)
                  + '); recordErr != nil {\n\t\tt.Fatal(recordErr)\n\t}',
              ),
              (
                  re.compile(
                      r'if err := al\.runMemoryReview\((.*?)\); err != nil \{\n\t\tt\.Fatalf\("post-restart review failed: %v", err\)\n\t\}',
                      re.S,
                  ),
                  lambda m: 'if reviewErr := al.runMemoryReview(' + m.group(1)
                  + '); reviewErr != nil {\n\t\tt.Fatalf("post-restart review failed: %v", reviewErr)\n\t}',
              ),
          ]
          counts = []
          for pattern, repl in replacements:
              text, count = pattern.subn(repl, text)
              counts.append(count)
          if any(count < 1 for count in counts):
              raise SystemExit(f"reviewer shadow replacements incomplete: {counts}")
          path.write_text(text)

      - name: Install exact linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Format with repository config
        run: golangci-lint fmt

      - name: Generate
        run: go generate ./...

      - name: Verify linter
        run: golangci-lint run --build-tags=goolm,stdjson

      - name: Verify affected tests
        run: go test -count=1 -tags goolm,stdjson ./pkg/memory ./pkg/agent ./cmd/membench

      - name: Commit clean lint fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/personalization-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy personalization lint gates"
          git push origin HEAD:fix/personalized-memory-v2-audit
