name: PR19 bounded formatter

on:
  push:
    branches:
      - feat/telegram-skill-checkpoint-interactions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install repository formatter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.10.1
          install-only: true
      - name: Format bounded files and publish
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find "$HOME" -maxdepth 3 -type f -name golangci-lint -perm -111 | head -n 1)"
          test -n "$bin"
          "$bin" fmt
          rm .github/workflows/pr19-format-final.yml
          git add -- \
            pkg/agent/skill_checkpoint_interaction_test.go \
            pkg/agent/checkpoint_commands.go \
            pkg/agent/skill_commands.go \
            pkg/channels/telegram/structured_delivery.go \
            .github/workflows/pr19-format-final.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(telegram): finalize interaction formatting"
          git push origin HEAD:feat/telegram-skill-checkpoint-interactions
