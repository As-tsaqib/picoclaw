\t\ttoolsRegistry.Register(tools.NewSendDiceTool())
\t}
''',
              '''\tif cfg.Tools.IsToolEnabled("send_dice") {
\t\ttoolsRegistry.Register(tools.NewSendDiceTool())
\t}
\tif cfg.Tools.IsToolEnabled("send_live_photo") {
