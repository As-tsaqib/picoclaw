name: PR17 observable finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/telegram-interactive-command-ux'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/telegram-interactive-command-ux
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose exact transport state
        shell: bash
        run: |
          set -u
          echo "memory=$(git hash-object pkg/agent/memory_commands.go)"
          echo "security=$(git hash-object pkg/agent/memory_interaction_security_test.go)"
          echo "structured=$(git hash-object pkg/channels/telegram/structured_delivery.go)"
          PATCH_B64="$(sed -n 's/^          PATCH_B64: //p' .github/workflows/pr17-finalize.yml)"
          echo "payload_len=${#PATCH_B64}"
          echo "payload_sha=$(printf '%s' "$PATCH_B64" | sha256sum | awk '{print $1}')"
          if printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/pr17-source-final.patch; then
            echo "patch_sha=$(sha256sum /tmp/pr17-source-final.patch | awk '{print $1}')"
            git apply --check /tmp/pr17-source-final.patch && echo "apply_check=ok" || echo "apply_check=failed"
          else
            echo "decode=failed"
          fi
