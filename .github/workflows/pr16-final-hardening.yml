name: PR16 Final Hardening Helper

on:
  push:
    branches:
      - feat/native-telegram-capabilities-memory-hardening
    paths:
      - .github/workflows/pr16-final-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Apply final hardening patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one snippet in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Capability truth + transient downgrade hardening.
          replace_once(
              "pkg/capability/capability.go",
              '''\t// Distinguish genuine unsupported method from transient network/auth/rate-limit errors
\t// Do NOT downgrade on 401, 403, 429, timeout, network error
\tif strings.Contains(errStr, "401") || strings.Contains(errStr, "403") ||
\t\tstrings.Contains(errStr, "429") || strings.Contains(errStr, "too many requests") ||
\t\tstrings.Contains(errStr, "timeout") || strings.Contains(errStr, "connection refused") ||
\t\tstrings.Contains(errStr, "unauthorized") || strings.Contains(errStr, "forbidden") {
\t\treturn false
\t}
''',
              '''\t// Distinguish genuine unsupported method/field responses from transient
\t// transport, authentication, rate-limit, and server failures. A temporary
\t// outage must never poison capability truth for the cache TTL.
\tif strings.Contains(errStr, "401") || strings.Contains(errStr, "403") ||
\t\tstrings.Contains(errStr, "429") || strings.Contains(errStr, "too many requests") ||
\t\tstrings.Contains(errStr, "timeout") || strings.Contains(errStr, "timed out") ||
\t\tstrings.Contains(errStr, "connection refused") || strings.Contains(errStr, "connection reset") ||
\t\tstrings.Contains(errStr, "network is unreachable") || strings.Contains(errStr, "no such host") ||
\t\tstrings.Contains(errStr, "temporary failure") || strings.Contains(errStr, "unauthorized") ||
\t\tstrings.Contains(errStr, "forbidden") || containsHTTP5xx(errStr) {
\t\treturn false
\t}
''')
          replace_once(
              "pkg/capability/capability.go",
              '''func (c *NegativeCapabilityCache) RecordFailure(channel, account, serverID string, feature Feature, err error) bool {
''',
              '''func containsHTTP5xx(value string) bool {
\tfor i := 0; i+2 < len(value); i++ {
\t\tif value[i] != '5' || value[i+1] < '0' || value[i+1] > '9' || value[i+2] < '0' || value[i+2] > '9' {
\t\t\tcontinue
\t\t}
\t\tbeforeDigit := i > 0 && value[i-1] >= '0' && value[i-1] <= '9'
\t\tafterDigit := i+3 < len(value) && value[i+3] >= '0' && value[i+3] <= '9'
\t\tif !beforeDigit && !afterDigit {
\t\t\treturn true
\t\t}
\t}
\treturn false
}

func (c *NegativeCapabilityCache) RecordFailure(channel, account, serverID string, feature Feature, err error) bool {
''')
          replace_once("pkg/capability/capability.go", "\t\t\tFeatureMessageStreamText,\n", "")
          replace_once(
              "pkg/capability/capability.go",
              "\t\t\tFeatureMediaVideoNote,\n\t\t\tFeatureLocationPoint,\n",
              "\t\t\tFeatureMediaVideoNote,\n\t\t\tFeatureMediaLivePhoto,\n\t\t\tFeatureLocationPoint,\n")
          replace_once(
              "pkg/capability/capability.go",
              '''\t\t// Ephemeral delivery is conditional
\t\tif route.IsEphemeral {
\t\t\tset[FeatureMessageEphemeral] = CapabilityInfo{State: StateSupported}
\t\t} else {
\t\t\tset[FeatureMessageEphemeral] = CapabilityInfo{State: StateConditional, Condition: "ephemeral_route"}
\t\t}

\t\t// Checklist requires business connection
\t\tif route.HasBusinessContext {
\t\t\tset[FeatureChecklistNative] = CapabilityInfo{State: StateSupported}
\t\t} else {
\t\t\tset[FeatureChecklistNative] = CapabilityInfo{State: StateConditional, Condition: "business_connection"}
\t\t}
\t\tset[FeatureMediaLivePhoto] = CapabilityInfo{State: StateUnsupported, Condition: "not_implemented"}
\t\tset[FeaturePollMedia] = CapabilityInfo{State: StateUnsupported, Condition: "not_implemented"}

\t\t// Rich stream draft
\t\tif cache != nil && cache.IsDowngraded(route.Channel, route.Account, route.ServerID, FeatureMessageStreamRich) {
\t\t\tset[FeatureMessageStreamRich] = CapabilityInfo{State: StateUnsupported}
\t\t} else {
\t\t\tset[FeatureMessageStreamRich] = CapabilityInfo{State: StateUnsupported, Condition: "text_draft_only"}
\t\t}
''',
              '''\t\t// Draft streaming deliberately fails closed on callback-private routes:
\t\t// the draft APIs do not carry the receiver/callback authority required by
\t\t// an ephemeral response. Persistent Telegram routes support both text and
\t\t// typed rich drafts.
\t\tif route.IsEphemeral {
\t\t\tset[FeatureMessageStreamText] = CapabilityInfo{State: StateConditional, Condition: "non_ephemeral_route"}
\t\t\tset[FeatureMessageStreamRich] = CapabilityInfo{State: StateConditional, Condition: "non_ephemeral_route"}
\t\t\tset[FeatureMessageEphemeral] = CapabilityInfo{State: StateSupported}
\t\t} else {
