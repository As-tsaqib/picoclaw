name: Model Hardening Race

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  race:
    name: Model/Session Race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run session race tests
        run: go test -race -tags goolm,stdjson ./pkg/session/...

      - name: Run model catalog race tests
        run: go test -race -tags goolm,stdjson ./pkg/modelcatalog/...

      - name: Run model/session agent and Telegram race tests
        run: go test -race -tags goolm,stdjson ./pkg/agent/... ./pkg/channels/telegram/... ./pkg/commands/...
