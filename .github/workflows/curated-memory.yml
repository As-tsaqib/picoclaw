name: Curated Memory Feature

on:
  push:
    branches:
      - feat/curated-memory-recall
      - feat/contextual-memory-evolution
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go-validation:
    name: Go tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Install Matrix crypto headers
        # Matrix support links against libolm when the full package graph is tested or built.
        run: sudo apt-get update && sudo apt-get install --yes libolm-dev

      - name: Run all Go tests
        run: go test ./...

      - name: Build PicoClaw
        run: go build ./cmd/picoclaw

  memory-evolution-race:
    name: Memory and evolution race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run focused race tests
        run: |
          go test -race ./pkg/memory
          go test -race ./pkg/agent -run '^(Test.*(Memory|Checkpoint|Recall).*)$'
          go test -race ./pkg/tools -run '^(Test.*(Memory|Checkpoint|Recall).*)$'
          go test -race ./pkg/evolution
          go test -race ./pkg/agent -run '^(Test.*Evolution.*)$'
          go test -race ./web/backend/api -run '^(Test.*(Memory|Evolution).*)$'

  static-analysis:
    name: Go static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  frontend:
    name: Dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dashboard config tests
        run: pnpm test:config

      - name: Run frontend lint
        run: pnpm lint

      - name: Check frontend formatting
        run: >-
          pnpm exec prettier --check
          package.json
          src/components/config/config-page.tsx
          src/components/config/config-sections.tsx
          src/components/config/form-model.ts
          src/components/config/memory-evolution-management.tsx
          src/i18n/locales/en.json
          tests/form-model.test.ts

      - name: Build frontend
        run: pnpm build
