name: PR16 Exact Lint Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr16-lint-fix.yml
      - .github/scripts/pr16_lint_fix.py

permissions:
  contents: write

concurrency:
  group: pr16-exact-lint-hardening
  cancel-in-progress: true

jobs:
  fix-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout published feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/native-telegram-capabilities-memory-hardening
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install repository linter version
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Apply semantic lint fixes and repository formatters
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/pr16_lint_fix.py
          golangci-lint fmt
          # Formatter v2 also rewrites a pre-existing build-tagged Bedrock file
          # that is outside this PR. Restore that baseline file, then run the
          # exact linter below to prove the restore does not hide an applicable
          # lint failure.
          git restore --source=HEAD -- pkg/providers/bedrock/provider_bedrock.go
          python3 <<'PY'
          import subprocess

          allowed = {
              "pkg/bus/native_single_media_test.go",
              "pkg/capability/capability.go",
              "pkg/capability/capability_test.go",
              "pkg/channels/manager_native_hardening_test.go",
              "pkg/channels/telegram/native_single_media_delivery.go",
              "pkg/channels/telegram/native_single_media_delivery_test.go",
              "pkg/channels/telegram/poll_hardening_test.go",
              "pkg/channels/telegram/telegram.go",
              "pkg/memory/curated_migration_hardening_test.go",
              "pkg/tools/native_single_media.go",
              "pkg/tools/poll_test.go",
              "web/backend/api/config.go",
          }
          changed = set(filter(None, subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()))
          unexpected = changed - allowed
          missing = {
              "pkg/channels/telegram/native_single_media_delivery.go",
              "pkg/memory/curated_migration_hardening_test.go",
              "pkg/tools/poll_test.go",
          } - changed
          if unexpected:
              raise SystemExit(f"formatter touched unexpected files: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"required semantic fixes missing: {sorted(missing)}")
          print("validated changed files:", *sorted(changed), sep="\n- ")
          PY

      - name: Targeted regression tests
        run: >-
          go test
          ./pkg/bus
          ./pkg/capability
          ./pkg/channels
          ./pkg/channels/telegram
          ./pkg/memory
          ./pkg/tools
          ./web/backend/api

      - name: Exact repository linter
        run: golangci-lint run --build-tags=goolm,stdjson

      - name: Commit and push validated lint fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pkg/bus/native_single_media_test.go \
            pkg/capability/capability.go \
            pkg/capability/capability_test.go \
            pkg/channels/manager_native_hardening_test.go \
            pkg/channels/telegram/native_single_media_delivery.go \
            pkg/channels/telegram/native_single_media_delivery_test.go \
            pkg/channels/telegram/poll_hardening_test.go \
            pkg/channels/telegram/telegram.go \
            pkg/memory/curated_migration_hardening_test.go \
            pkg/tools/native_single_media.go \
            pkg/tools/poll_test.go \
            web/backend/api/config.go
          if git diff --cached --quiet; then
            echo "Expected validated lint fixes but staged diff is empty"
            exit 1
          fi
          git commit -m "fix: satisfy final lint and quiz field hygiene"
          git push origin HEAD:feat/native-telegram-capabilities-memory-hardening