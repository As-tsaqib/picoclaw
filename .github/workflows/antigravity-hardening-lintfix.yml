name: Antigravity Hardening Lint Fix

on:
  push:
    branches:
      - fix/antigravity-hardening
    paths:
      - .github/workflows/antigravity-hardening-lintfix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "pkg/auth/store_test.go",
              "\tfor _, provider := range providers {\n\t\tprovider := provider\n",
              "\tfor _, provider := range providers {\n",
          )
          replace_once(
              "pkg/modelcatalog/discovery.go",
              "\tcred, err := auth.GetCredential(\"google-antigravity\")\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"loading antigravity credentials: %w\", err)\n",
              "\tcred, loadErr := auth.GetCredential(\"google-antigravity\")\n\tif loadErr != nil {\n\t\treturn nil, fmt.Errorf(\"loading antigravity credentials: %w\", loadErr)\n",
          )
          replace_once(
              "pkg/modelcatalog/discovery.go",
              "\tif err := ctx.Err(); err != nil {\n\t\treturn nil, err\n",
              "\tif ctxErr := ctx.Err(); ctxErr != nil {\n\t\treturn nil, ctxErr\n",
          )
          replace_once(
              "pkg/modelcatalog/discovery.go",
              "\t\tif err := ctx.Err(); err != nil {\n\t\t\treturn nil, err\n",
              "\t\tif ctxErr := ctx.Err(); ctxErr != nil {\n\t\t\treturn nil, ctxErr\n",
          )
          replace_once(
              "pkg/providers/oauth/antigravity_provider_test.go",
              "\tresp, err := provider.Chat(context.Background(), []Message{{Role: \"user\", Content: \"hello\"}}, nil, \"gemini-test\", nil)\n",
              "\tresp, err := provider.Chat(\n\t\tcontext.Background(),\n\t\t[]Message{{Role: \"user\", Content: \"hello\"}},\n\t\tnil,\n\t\t\"gemini-test\",\n\t\tnil,\n\t)\n",
          )
          PY

          gofmt -w \
            pkg/auth/store_test.go \
            pkg/modelcatalog/discovery.go \
            pkg/providers/oauth/antigravity_provider_test.go
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pkg/auth/store_test.go \
            pkg/modelcatalog/discovery.go \
            pkg/providers/oauth/antigravity_provider_test.go
          git rm .github/workflows/antigravity-hardening-lintfix.yml
          git commit -m "fix: satisfy antigravity hardening lint"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/antigravity-hardening
