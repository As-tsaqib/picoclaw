name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag on main (for example v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'As-tsaqib/picoclaw'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Verify tag exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag is not a stable semantic version."
            exit 1
          fi
          if ! gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "::error::Tag does not exist. Create it first using the 'Create Tag' workflow."
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify tag targets current main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse "origin/main^{commit}")"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "::error::Release tag must point to the current main commit ($main_sha); got $tag_sha."
            exit 1
          fi

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          INCLUDE_ANDROID_BUNDLE: "true"
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Apply release flags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -Eeuo pipefail
          gh release edit "$RELEASE_TAG" \
            --draft="$RELEASE_DRAFT" \
            --prerelease="$RELEASE_PRERELEASE" \
            --latest

      - name: Summarize standalone release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### Standalone release published"
            echo "- Repository: \`$REPOSITORY\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- GitHub Release: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "- Container: \`ghcr.io/as-tsaqib/picoclaw:$RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
