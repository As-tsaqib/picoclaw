\t\t\tif cache != nil && cache.IsDowngraded(route.Channel, route.Account, route.ServerID, FeatureMessageStreamRich) {
\t\t\t\tset[FeatureMessageStreamRich] = CapabilityInfo{State: StateUnsupported, Condition: "downgraded_by_server"}
\t\t\t} else {
\t\t\t\tset[FeatureMessageStreamRich] = CapabilityInfo{State: StateSupported}
\t\t\t}
