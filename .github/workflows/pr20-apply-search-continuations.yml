name: PR20 apply search continuation follow-up

on:
  push:
    branches:
      - fix/telegram-search-continuations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/telegram-search-continuations
          fetch-depth: 1
          persist-credentials: false

      - name: Apply bounded follow-up transformation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/apply.py.gz.b64 | gzip -dc > /tmp/apply.py
          python3 /tmp/apply.py

      - name: Format and validate focused packages
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            pkg/bus/structured.go \
            pkg/commands/cmd_use.go \
            pkg/agent/skill_commands.go \
            pkg/agent/memory_commands.go \
            pkg/agent/checkpoint_commands.go \
            pkg/agent/model_commands.go \
            pkg/agent/skill_checkpoint_acceptance_test.go \
            pkg/agent/skill_checkpoint_interaction_test.go \
            pkg/channels/telegram/structured_delivery.go
          git diff --check
          go test -tags goolm,stdjson ./pkg/bus ./pkg/commands ./pkg/agent ./pkg/channels/telegram
          go test -race -tags goolm,stdjson ./pkg/agent ./pkg/channels/telegram

      - name: Commit validated source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr20-apply-search-continuations.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): harden search interaction continuations"
          gh auth setup-git
          git push origin HEAD:fix/telegram-search-continuations
