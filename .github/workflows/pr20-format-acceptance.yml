name: PR20 acceptance formatter gate

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/telegram-search-continuations' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/telegram-search-continuations
          fetch-depth: 1
          persist-credentials: false

      - name: Format acceptance files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            pkg/agent/search_continuation_followup_test.go \
            pkg/channels/telegram/search_continuation_acceptance_test.go
          git diff --check

      - name: Run focused tests and races
        shell: bash
        run: |
          set -euo pipefail
          go test -tags goolm,stdjson ./pkg/agent ./pkg/channels/telegram
          go test -race -tags goolm,stdjson ./pkg/agent ./pkg/channels/telegram

      - name: Commit formatted validated tests and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr20-format-acceptance.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(telegram): validate search continuation acceptance"
          gh auth setup-git
          git push origin HEAD:fix/telegram-search-continuations
