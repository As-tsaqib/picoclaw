name: Antigravity Hardening Apply

on:
  push:
    branches:
      - fix/antigravity-hardening
    paths:
      - .github/workflows/antigravity-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply implementation and tests as structured commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat .github/hardening/impl_00 .github/hardening/impl_01 .github/hardening/impl_02 \
            | base64 -d | gzip -d > /tmp/impl.patch
          base64 -d .github/hardening/source_supp | gzip -d > /tmp/source-supp.patch
          base64 -d .github/hardening/tests_old | gzip -d > /tmp/tests.patch
          base64 -d .github/hardening/test_supp | gzip -d > /tmp/test-supp.patch

          git apply --check /tmp/impl.patch
          git apply /tmp/impl.patch
          git apply --check /tmp/source-supp.patch
          git apply /tmp/source-supp.patch
          git diff --check
          git add \
            cmd/picoclaw/internal/auth/helpers.go \
            pkg/auth/oauth.go \
            pkg/auth/oauth_context.go \
            pkg/auth/refresh_coordinator.go \
            pkg/auth/store.go \
            pkg/modelcatalog/discovery.go \
            pkg/providers/antigravity_catalog_context.go \
            pkg/providers/factory_provider.go \
            pkg/providers/oauth/antigravity_catalog_context.go \
            pkg/providers/oauth/antigravity_provider.go \
            pkg/providers/oauth_facade.go \
            web/backend/api/models.go
          git commit -m "fix: harden antigravity oauth and request recovery"

          git apply --check /tmp/tests.patch
          git apply /tmp/tests.patch
          git apply --check /tmp/test-supp.patch
          git apply /tmp/test-supp.patch
          git diff --check
          git add \
            pkg/agent/model_commands_hardening_test.go \
            pkg/auth/refresh_coordinator_test.go \
            pkg/auth/store_test.go \
            pkg/modelcatalog/discovery_provider_test.go \
            pkg/providers/factory_provider_test.go \
            pkg/providers/oauth/antigravity_catalog_context_test.go \
            pkg/providers/oauth/antigravity_provider_test.go
          git commit -m "test: cover antigravity concurrency and recovery"

          git rm -r .github/hardening
          git rm \
            .github/workflows/antigravity-hardening-apply.yml \
            .github/workflows/antigravity-hardening-bootstrap.yml
          git commit -m "ci: remove hardening bootstrap"

          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/antigravity-hardening
