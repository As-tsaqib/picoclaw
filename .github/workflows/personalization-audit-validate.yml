name: Personalization Audit Validate

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-audit-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/personalized-memory-v2-audit
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Generate
        run: go generate ./...

      - name: Targeted tests
        run: go test -tags goolm,stdjson ./pkg/memory ./pkg/agent ./pkg/tools ./pkg/commands ./cmd/membench

      - name: Focused race tests
        run: go test -race -tags goolm,stdjson ./pkg/memory ./pkg/agent ./pkg/tools
