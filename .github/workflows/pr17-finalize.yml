name: PR17 finalize source

on:
  push:
    branches:
      - feat/telegram-interactive-command-ux
    paths:
      - .github/workflows/pr17-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/telegram-interactive-command-ux
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Apply exact source patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object pkg/agent/memory_commands.go)" = "c53b58473e14d6845f6560afd31b8b7ca0ff8327"
          test "$(git hash-object pkg/agent/memory_interaction_security_test.go)" = "fc31087f2f0310ccf1bd11f76dee97b622602e42"
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "b463bbfdf07f1e3f73e92046b50229b49042778e"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/pr17-source-final.patch
          test "$(sha256sum /tmp/pr17-source-final.patch | awk '{print $1}')" = "80480ebea7a7650875ddb64223203b0ccb9b3d4c1e927dd932eb43dad193d244"
          git apply --check /tmp/pr17-source-final.patch
          git apply /tmp/pr17-source-final.patch
          gofmt -w pkg/agent/memory_commands.go pkg/agent/memory_interaction_security_test.go pkg/channels/telegram/structured_delivery.go pkg/channels/telegram/structured_privacy_hardening_test.go
          git diff --check
          test "$(git hash-object pkg/agent/memory_commands.go)" = "4e12d4f04459cb5ab33d86de0a5100cc128ab15f"
          test "$(git hash-object pkg/agent/memory_interaction_security_test.go)" = "8b21431888f7088f4a295e235f71c855d8636c70"
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "06d0c4ca0c647ccb23fa105f62ef68f514e21478"
          test "$(git hash-object pkg/channels/telegram/structured_privacy_hardening_test.go)" = "0b6044cfe8163da9d4f0ba93f7ced1d40b106cd5"
      - name: Run targeted Go tests
        run: go test -tags goolm,stdjson ./pkg/commands/... ./pkg/channels/telegram/... ./pkg/agent/...
      - name: Run Telegram race regression
        run: go test -race -tags goolm,stdjson ./pkg/channels/telegram/...
      - name: Commit source and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr17-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): finalize private memory interaction hardening"
          git push origin HEAD:feat/telegram-interactive-command-ux
