name: PR16 Frontend Format Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr16-frontend-format.yml

permissions:
  contents: write

concurrency:
  group: pr16-frontend-format-fix
  cancel-in-progress: true

jobs:
  format-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout published feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/native-telegram-capabilities-memory-hardening
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Format exact failing frontend files
        working-directory: web/frontend
        run: pnpm exec prettier --write src/components/config/form-model.ts tests/form-model.test.ts

      - name: Enforce formatter scope
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'web/frontend/src/components/config/form-model.ts\nweb/frontend/tests/form-model.test.ts'

      - name: Frontend configuration tests
        working-directory: web/frontend
        run: pnpm test:config

      - name: Frontend browser tests
        working-directory: web/frontend
        run: pnpm exec vitest run src

      - name: Frontend lint
        working-directory: web/frontend
        run: pnpm lint

      - name: Frontend production build
        working-directory: web/frontend
        run: pnpm build

      - name: Commit and push formatting fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/frontend/src/components/config/form-model.ts web/frontend/tests/form-model.test.ts
          git commit -m "style: format memory dashboard changes"
          git push origin HEAD:feat/native-telegram-capabilities-memory-hardening