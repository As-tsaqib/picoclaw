name: Personalization Lint Fix

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-lint-fix.yml

permissions:
  contents: write

jobs:
  format-lint-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Fix lint-only declarations
        shell: python
        run: |
          from pathlib import Path

          def fix_following_fatal(lines, index, var):
              if index + 1 >= len(lines):
                  return
              if "t.Fatal(err)" in lines[index + 1]:
                  lines[index + 1] = lines[index + 1].replace("t.Fatal(err)", f"t.Fatal({var})", 1)
              elif 't.Fatalf("post-restart review failed: %v", err)' in lines[index + 1]:
                  lines[index + 1] = lines[index + 1].replace(
                      't.Fatalf("post-restart review failed: %v", err)',
                      f't.Fatalf("post-restart review failed: %v", {var})',
                      1,
                  )

          def rewrite_if_errors(path, starters):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              active = None
              changed = 0
              for i, original in enumerate(lines):
                  line = original
                  if active is None:
                      matched = False
                      for needle, replacement, var in starters:
                          if needle not in line:
                              continue
                          line = line.replace(needle, replacement, 1)
                          changed += 1
                          matched = True
                          if "err != nil {" in line:
                              line = line.replace("err != nil {", f"{var} != nil {{", 1)
                              fix_following_fatal(lines, i, var)
                          else:
                              active = var
                          lines[i] = line
                          break
                      if matched:
                          continue
                  if active is not None and "err != nil {" in line:
                      lines[i] = line.replace("err != nil {", f"{active} != nil {{", 1)
                      fix_following_fatal(lines, i, active)
                      active = None
              if active is not None:
                  raise SystemExit(f"unterminated lint-only if rewrite in {path}: {active}")
              if changed == 0:
                  raise SystemExit(f"no lint-only declarations rewritten in {path}")
              p.write_text("".join(lines))

          rewrite_if_errors(
              "pkg/agent/context_manager_test.go",
              [
                  ("if _, err := recall.AppendDeliveredTurn(", "if _, appendErr := recall.AppendDeliveredTurn(", "appendErr"),
                  ("if err := al.contextManager.Compact(", "if compactErr := al.contextManager.Compact(", "compactErr"),
              ],
          )
          rewrite_if_errors(
              "cmd/membench/personalization.go",
              [("if _, err := store.Retrieve(", "if _, retrieveErr := store.Retrieve(", "retrieveErr")],
          )
          rewrite_if_errors(
              "pkg/memory/user_profile_test.go",
              [("if _, err := store.ApplyBatch(", "if _, applyErr := store.ApplyBatch(", "applyErr")],
          )
          rewrite_if_errors(
              "pkg/agent/memory_reviewer_test.go",
              [
                  ("if _, err := recall.AppendDeliveredTurn(", "if _, appendErr := recall.AppendDeliveredTurn(", "appendErr"),
                  ("if _, err := reviewState.RecordSuccessfulTurn(", "if _, recordErr := reviewState.RecordSuccessfulTurn(", "recordErr"),
                  ("if err := al.runMemoryReview(", "if reviewErr := al.runMemoryReview(", "reviewErr"),
              ],
          )

          schema = Path("pkg/memory/curated_schema.go")
          text = schema.read_text()
          old = '''\tif max := maxConfidenceForEvidence(evidence); confidence > max {\n\t\treturn max\n\t}\n'''
          new = '''\tif maxConfidence := maxConfidenceForEvidence(evidence); confidence > maxConfidence {\n\t\treturn maxConfidence\n\t}\n'''
          if old not in text:
              raise SystemExit("predeclared max block not found")
          schema.write_text(text.replace(old, new, 1))

      - name: Install exact linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Format with repository config
        run: golangci-lint fmt

      - name: Generate
        run: go generate ./...

      - name: Verify linter
        run: golangci-lint run --build-tags=goolm,stdjson

      - name: Verify affected tests
        run: go test -count=1 -tags goolm,stdjson ./pkg/memory ./pkg/agent ./cmd/membench

      - name: Commit clean lint fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/personalization-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy personalization lint gates"
          git push origin HEAD:fix/personalized-memory-v2-audit
