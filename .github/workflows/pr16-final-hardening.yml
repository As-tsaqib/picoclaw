\t\tset[FeaturePollMedia] = CapabilityInfo{State: StateUnsupported, Condition: "not_implemented"}
''')
          replace_once(
              "pkg/capability/capability.go",
              '\t\t{FeatureMediaVideoNote, "video_note"},\n\t\t{FeatureLocationPoint, "location"},\n',
              '\t\t{FeatureMediaVideoNote, "video_note"},\n\t\t{FeatureMediaLivePhoto, "live_photo"},\n\t\t{FeatureLocationPoint, "location"},\n')

          # Tool reachability for Live Photo.
          replace_once(
              "pkg/agent/instance.go",
