name: Sync upstream release

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Open reviewable upstream release PR
    if: github.repository == 'As-tsaqib/picoclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      sync_sha: ${{ steps.sync.outputs.sync_sha }}

    steps:
      - name: Checkout fork main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Stage trusted sync helper outside the checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 \
            scripts/upstream-sync/reviewable-sync.sh \
            "$RUNNER_TEMP/reviewable-upstream-sync.sh"

      - name: Create or report the reviewable sync pull request
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/reviewable-upstream-sync.sh"

  validate:
    name: Validate untrusted upstream changes
    needs: sync
    if: needs.sync.outputs.sync_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/upstream-sync-validation.yml
    with:
      ref: ${{ needs.sync.outputs.sync_sha }}
