name: Personalization Snapshot

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive source
        run: |
          tar --exclude=.git -czf /tmp/picoclaw-audit-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: picoclaw-audit-source
          path: /tmp/picoclaw-audit-source.tar.gz
          if-no-files-found: error
