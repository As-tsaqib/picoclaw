name: Upstream Sync Validation

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA for the prepared upstream sync branch
        required: true
        type: string
  push:
    branches:
      - chore/reviewable-upstream-sync
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: upstream-sync-validation-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Sync workflow policy tests
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run reviewable sync tests
        shell: bash
        run: bash scripts/upstream-sync/test-reviewable-sync.sh

  go-validation:
    name: Go tests and PicoClaw build
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' -t go_files < <(find . -name '*.go' -not -path './vendor/*' -print0)
          unformatted="$(gofmt -l "${go_files[@]}")"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Install Matrix crypto headers
        run: sudo apt-get update && sudo apt-get install --yes libolm-dev

      - name: Run all Go tests
        run: go test ./...

      - name: Build PicoClaw
        run: go build ./cmd/picoclaw

  static-analysis:
    name: Go static analysis
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  focused-race:
    name: Focused memory and evolution race tests
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run focused race tests
        shell: bash
        run: |
          go test -race ./pkg/memory
          go test -race ./pkg/agent -run '^(Test.*(Memory|Checkpoint|Recall).*)$'
          go test -race ./pkg/tools -run '^(Test.*(Memory|Checkpoint|Recall).*)$'
          go test -race ./pkg/evolution
          go test -race ./pkg/agent -run '^(Test.*Evolution.*)$'
          go test -race ./web/backend/api -run '^(Test.*(Memory|Evolution).*)$'

  dashboard:
    name: Dashboard tests, lint, formatting, and build
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dashboard configuration tests
        run: pnpm test:config

      - name: Run frontend tests
        run: pnpm exec vitest run src

      - name: Run frontend lint
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm format

      - name: Build frontend
        run: pnpm build
