name: PR17 lint fix

on:
  push:
    branches:
      - feat/telegram-interactive-command-ux
    paths:
      - .github/workflows/pr17-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/telegram-interactive-command-ux
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact golines-only fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "06d0c4ca0c647ccb23fa105f62ef68f514e21478"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pkg/channels/telegram/structured_delivery.go")
          text = path.read_text()
          old = '\t\treturn true, c.sendSessionRenameNotice(ctx, message, prompt, "Permintaan tidak dapat diproses. Jalankan command lagi.")\n'
          new = '''\t\treturn true, c.sendSessionRenameNotice(\n\t\t\tctx, message, prompt,\n\t\t\t"Permintaan tidak dapat diproses. Jalankan command lagi.",\n\t\t)\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exact lint target once")
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "b0ee24cdfe494b4f77b27094ec7069bcb860d2d7"
          git diff --check
          rm .github/workflows/pr17-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(telegram): satisfy golines for private notice"
          git push origin HEAD:feat/telegram-interactive-command-ux
