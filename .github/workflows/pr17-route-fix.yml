name: PR17 route normalization fix

on:
  push:
    branches:
      - feat/telegram-interactive-command-ux
    paths:
      - .github/workflows/pr17-route-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/telegram-interactive-command-ux
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact forum-route normalization fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "b0ee24cdfe494b4f77b27094ec7069bcb860d2d7"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pkg/channels/telegram/structured_delivery.go")
          text = path.read_text()
          old = '''func expectedMemoryMenuRoute(chatID int64, threadID int) (string, string) {
          \tchat := strconv.FormatInt(chatID, 10)
          \ttopic := ""
          \tif threadID > 0 {
          \t\ttopic = strconv.Itoa(threadID)
          \t}
          \treturn chat, topic
          }
          '''
          new = '''func expectedMemoryMenuRoute(chatID int64, threadID int) (string, string) {
          \tchat := strconv.FormatInt(chatID, 10)
          \ttopic := ""
          \tif threadID > 0 {
          \t\ttopic = strconv.Itoa(threadID)
          \t\tchat += "/" + topic
          \t}
          \treturn chat, topic
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exact route helper once")
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object pkg/channels/telegram/structured_delivery.go)" = "c8926b443a485cc3dda54b3a7f3c726c98b741c4"
          git diff --check
      - name: Verify failing regression directly
        run: go test -tags goolm,stdjson ./pkg/channels/telegram/... -run '^TestMemoryForceReply_SearchAndEditFlows$' -count=1
      - name: Commit fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr17-route-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): normalize memory forum route binding"
          git push origin HEAD:feat/telegram-interactive-command-ux
