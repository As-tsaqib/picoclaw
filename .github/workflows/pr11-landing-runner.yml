name: PR11 Landing Runner

on:
  push:
    branches:
      - automation/pr11-landing-helper

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  land:
    if: github.repository == 'As-tsaqib/picoclaw'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: automation/pr11-landing-helper

      - name: Restore shipped PR Completion helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prc
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr11-landing-helper.yml').read_text()
          marker = "cat > /tmp/prc.b64 <<'EOF'\n"
          block = source.split(marker, 1)[1].split("\n          EOF", 1)[0]
          payload = "\n".join(line.strip() for line in block.splitlines() if line.strip()) + "\n"
          Path('/tmp/prc.b64').write_text(payload)
          PY
          base64 -d /tmp/prc.b64 > /tmp/prc.tgz
          echo '5bb8bef99e29ce405f3afa92a21e5efc2adb0f6c04e3ce67db5252d6d17edff9  /tmp/prc.tgz' | sha256sum -c -
          tar -xzf /tmp/prc.tgz -C /tmp/prc
          python3 -m py_compile /tmp/prc/pr_land.py /tmp/prc/pr_watch.py

      - name: Guarded exact-head landing
        id: landing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR='https://github.com/As-tsaqib/picoclaw/pull/11'
          HEAD='72c4056502b1b5900de5971c7f93fe692324b1b1'
          python3 /tmp/prc/pr_land.py \
            --repo "$GITHUB_WORKSPACE" \
            --pr "$PR" \
            --head "$HEAD" \
            --mode auto \
            --method squash \
            --pretty | tee /tmp/plan.json
          DIGEST="$(python3 -c 'import json; print(json.load(open("/tmp/plan.json"))["readinessPolicyDigest"])')"
          python3 /tmp/prc/pr_land.py \
            --repo "$GITHUB_WORKSPACE" \
            --pr "$PR" \
            --head "$HEAD" \
            --mode auto \
            --method squash \
            --policy-digest "$DIGEST" \
            --confirm \
            --pretty | tee /tmp/landing.json
          REQUESTED_AT="$(python3 -c 'import json; print(json.load(open("/tmp/landing.json"))["requestedAt"])')"
          python3 /tmp/prc/pr_watch.py \
            --target "$GITHUB_WORKSPACE=$PR" \
            --await-merge "$HEAD" \
            --await-merge-mode auto \
            --await-merge-since "$REQUESTED_AT" \
            --mode until-actionable \
            --interval 5 \
            --max-interval 10 \
            --timeout 180 \
            --pretty | tee /tmp/watch.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/watch.json"))["state"])')" = merged

      - name: Record observable landing result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          mkdir -p .github/landing-results
          {
            echo "job_status=$JOB_STATUS"
            echo "runner_sha=$GITHUB_SHA"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- pr ---'
            gh pr view 'https://github.com/As-tsaqib/picoclaw/pull/11' --json number,state,mergedAt,headRefOid,baseRefOid,url 2>&1 || true
            for f in /tmp/plan.json /tmp/landing.json /tmp/watch.json; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                cat "$f"
              fi
            done
          } > .github/landing-results/pr11.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/landing-results/pr11.txt
          git commit -m 'chore: record PR 11 landing result' || true
          git push origin HEAD:automation/pr11-landing-helper
