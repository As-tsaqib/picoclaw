name: PR20 bounded continuation patch runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/telegram-search-continuations' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/telegram-search-continuations
          fetch-depth: 1
          persist-credentials: false

      - name: Extract and apply bounded transform
        shell: bash
        run: |
          set -euo pipefail
          awk '/^H4sI/{print; exit}' .github/workflows/pr20-apply-search-continuations.yml > /tmp/apply.py.gz.b64
          test -s /tmp/apply.py.gz.b64
          base64 -d /tmp/apply.py.gz.b64 | gzip -dc > /tmp/apply.py
          python3 -m py_compile /tmp/apply.py
          python3 /tmp/apply.py

      - name: Fix safe generated ordering and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pkg/agent/memory_commands.go')
          s = p.read_text()
          old = '''\t\tbound.Query = menu.Query\n\t\tbound.SessionKey = menu.SessionKey\n\t\tif bindErr != nil {\n'''
          new = '''\t\tif bindErr != nil {\n'''
          if old in s:
              s = s.replace(old, new, 1)
              marker = '''\t\t\treturn\n\t\t}\n\t\tresponse.Content.Interaction = bound\n'''
              repl = '''\t\t\treturn\n\t\t}\n\t\tbound.Query = menu.Query\n\t\tbound.SessionKey = menu.SessionKey\n\t\tresponse.Content.Interaction = bound\n'''
              if marker not in s:
                  raise SystemExit('memory interaction rebind marker missing')
              s = s.replace(marker, repl, 1)
              p.write_text(s)
          PY
          gofmt -w \
            pkg/bus/structured.go \
            pkg/commands/cmd_use.go \
            pkg/agent/skill_commands.go \
            pkg/agent/memory_commands.go \
            pkg/agent/checkpoint_commands.go \
            pkg/agent/model_commands.go \
            pkg/agent/skill_checkpoint_acceptance_test.go \
            pkg/agent/skill_checkpoint_interaction_test.go \
            pkg/channels/telegram/structured_delivery.go
          git diff --check

      - name: Validate focused packages and races
        shell: bash
        run: |
          set -euo pipefail
          go test -tags goolm,stdjson ./pkg/bus ./pkg/commands ./pkg/agent ./pkg/channels/telegram
          go test -race -tags goolm,stdjson ./pkg/agent ./pkg/channels/telegram

      - name: Commit validated source without helper workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr20-apply-search-continuations.yml
          rm -f .github/workflows/pr20-run-search-continuations.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): harden search interaction continuations"
          gh auth setup-git
          git push origin HEAD:fix/telegram-search-continuations
