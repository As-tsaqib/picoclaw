name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag name (required, e.g. v1.0.0)"
        required: true
        type: string
      commit:
        description: "Full 40-character target commit SHA (leave empty for current main)"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: create-stable-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    if: github.repository == 'As-tsaqib/picoclaw'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Validate stable tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ inputs.commit }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag is not a stable semantic version."
            exit 1
          fi
          if [[ -n "$TARGET_COMMIT" && ! "$TARGET_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Commit must be an empty value or a full 40-character SHA."
            exit 1
          fi

      - name: Check tag does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "::error::The requested tag already exists."
            exit 1
          fi

      - name: Create annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ inputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          target_ref="origin/main"
          if [[ -n "$TARGET_COMMIT" ]]; then
            target_ref="$TARGET_COMMIT"
          fi
          if ! git cat-file -e "${target_ref}^{commit}" 2>/dev/null; then
            echo "::error::The requested commit does not exist."
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse "${target_ref}^{commit}")"
          MAIN_SHA="$(git rev-parse "origin/main^{commit}")"
          if [[ "$COMMIT_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Stable releases must tag the current main commit ($MAIN_SHA); got $COMMIT_SHA."
            exit 1
          fi
          tag_object_sha="$(gh api --method POST "repos/$REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Release $RELEASE_TAG" \
            -f object="$COMMIT_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object_sha" \
            --silent
          {
            echo "### Tag Created"
            echo "- **Tag:** \`$RELEASE_TAG\`"
            echo "- **Commit:** \`$COMMIT_SHA\`"
            echo "- **Source branch:** \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
