name: Personalization Benchmark Temp

on:
  push:
    branches:
      - feat/personalized-memory-v2

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run deterministic personalization benchmark
        run: go run ./cmd/membench personalization --out /tmp/personalization-bench

      - name: Run cached profile microbenchmark
        run: go test ./pkg/memory -run '^$' -bench '^BenchmarkCompileUserProfileCached$' -benchmem -count=3
