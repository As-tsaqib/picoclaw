\t\t\t\tentry.LastConfirmedAt = &confirmed
\t\t\t\tentry.LastVerifiedAt = &confirmed
\t\t\t}
''',
              '''\t\t\tif !mutation.migrationPreserveMetadata {
\t\t\t\tif entry.EvidenceCount == 0 {
\t\t\t\t\tentry.EvidenceCount = 1
\t\t\t\t}
\t\t\t\tif evidence == CuratedEvidenceObserved && entry.ObservationCount == 0 {
\t\t\t\t\tentry.ObservationCount = entry.EvidenceCount
\t\t\t\t}
\t\t\t\tif entry.LastConfirmedAt == nil && entry.LastVerifiedAt != nil {
\t\t\t\t\tentry.LastConfirmedAt = entry.LastVerifiedAt
\t\t\t\t}
\t\t\t\tif evidence == CuratedEvidenceExplicit && entry.LastConfirmedAt == nil {
\t\t\t\t\tconfirmed := now
\t\t\t\t\tentry.LastConfirmedAt = &confirmed
\t\t\t\t\tentry.LastVerifiedAt = &confirmed
\t\t\t\t}
\t\t\t}
''')
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\t\tif mutation.EvidenceCount > 0 {
\t\t\t\tentries[idx].EvidenceCount = mutation.EvidenceCount
\t\t\t}
\t\t\tif mutation.ObservationCount > 0 {
\t\t\t\tentries[idx].ObservationCount = mutation.ObservationCount
\t\t\t}
''',
              '''\t\t\tif mutation.migrationPreserveMetadata {
\t\t\t\tentries[idx].EvidenceCount = mutation.EvidenceCount
\t\t\t\tentries[idx].ObservationCount = mutation.ObservationCount
\t\t\t\tentries[idx].Pinned = mutation.migrationPinned
\t\t\t\tif !mutation.migrationCreatedAt.IsZero() {
\t\t\t\t\tentries[idx].CreatedAt = mutation.migrationCreatedAt
\t\t\t\t}
\t\t\t} else {
\t\t\t\tif mutation.EvidenceCount > 0 {
\t\t\t\t\tentries[idx].EvidenceCount = mutation.EvidenceCount
\t\t\t\t}
\t\t\t\tif mutation.ObservationCount > 0 {
\t\t\t\t\tentries[idx].ObservationCount = mutation.ObservationCount
\t\t\t\t}
\t\t\t}
''')
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\t\tif mutation.LastConfirmedAt != nil {
\t\t\t\tentries[idx].LastConfirmedAt = mutation.LastConfirmedAt
\t\t\t\tentries[idx].LastVerifiedAt = mutation.LastConfirmedAt
\t\t\t} else if mutation.LastVerifiedAt != nil {
\t\t\t\tentries[idx].LastVerifiedAt = mutation.LastVerifiedAt
\t\t\t\tentries[idx].LastConfirmedAt = mutation.LastVerifiedAt
\t\t\t} else if NormalizeEvidenceKind(mutation.EvidenceKind) == CuratedEvidenceExplicit {
\t\t\t\t// Only a mutation that explicitly carries direct-user evidence refreshes
\t\t\t\t// confirmation. A curator rewrite of an existing explicit memory does not.
\t\t\t\tconfirmed := now
\t\t\t\tentries[idx].LastConfirmedAt = &confirmed
\t\t\t\tentries[idx].LastVerifiedAt = &confirmed
\t\t\t} else if mutation.EvidenceKind != "" {
\t\t\t\tentries[idx].LastConfirmedAt = nil
\t\t\t\tentries[idx].LastVerifiedAt = nil
\t\t\t}
''',
              '''\t\t\tif mutation.migrationPreserveMetadata {
\t\t\t\tentries[idx].LastConfirmedAt = mutation.LastConfirmedAt
\t\t\t\tentries[idx].LastVerifiedAt = mutation.LastVerifiedAt
\t\t\t} else if mutation.LastConfirmedAt != nil {
\t\t\t\tentries[idx].LastConfirmedAt = mutation.LastConfirmedAt
\t\t\t\tentries[idx].LastVerifiedAt = mutation.LastConfirmedAt
\t\t\t} else if mutation.LastVerifiedAt != nil {
\t\t\t\tentries[idx].LastVerifiedAt = mutation.LastVerifiedAt
\t\t\t\tentries[idx].LastConfirmedAt = mutation.LastVerifiedAt
\t\t\t} else if NormalizeEvidenceKind(mutation.EvidenceKind) == CuratedEvidenceExplicit {
\t\t\t\t// Only a mutation that explicitly carries direct-user evidence refreshes
\t\t\t\t// confirmation. A curator rewrite of an existing explicit memory does not.
\t\t\t\tconfirmed := now
\t\t\t\tentries[idx].LastConfirmedAt = &confirmed
\t\t\t\tentries[idx].LastVerifiedAt = &confirmed
\t\t\t} else if mutation.EvidenceKind != "" {
\t\t\t\tentries[idx].LastConfirmedAt = nil
\t\t\t\tentries[idx].LastVerifiedAt = nil
\t\t\t}
''')
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\t\tentries[idx].Provenance = mutation.Provenance
\t\t\tentries[idx].UpdatedAt = now
''',
              '''\t\t\tentries[idx].Provenance = mutation.Provenance
\t\t\tentries[idx].UpdatedAt = now
\t\t\tif mutation.migrationPreserveMetadata && !mutation.migrationUpdatedAt.IsZero() {
