name: Personalization Race Temp

on:
  push:
    branches:
      - feat/personalized-memory-v2

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Race-test memory core
        run: go test -race ./pkg/memory

      - name: Race-test agent memory paths
        run: go test -race ./pkg/agent -run '^(Test.*(Memory|Checkpoint|Recall|Profile).*)$'

      - name: Race-test memory tools
        run: go test -race ./pkg/tools -run '^(Test.*(Memory|Checkpoint|Recall).*)$'
