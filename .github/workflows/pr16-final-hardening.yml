''')

          # Migration-only metadata is process-local and never model-controlled.
          replace_once(
              "pkg/memory/curated_types.go",
              '''\tLastConfirmedAt  *time.Time `json:"last_confirmed_at,omitempty"`
\tProvenance       Provenance `json:"provenance"`
}
''',
              '''\tLastConfirmedAt  *time.Time `json:"last_confirmed_at,omitempty"`
\tProvenance       Provenance `json:"provenance"`

\t// migrationPreserveMetadata is intentionally unexported. It allows the
