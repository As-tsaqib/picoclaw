name: PR17 hardening apply

on:
  push:
    branches:
      - feat/telegram-interactive-command-ux
    paths:
      - .github/workflows/pr17-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/telegram-interactive-command-ux
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Apply exact finalization patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object pkg/agent/memory_commands.go)" = "c53b58473e14d6845f6560afd31b8b7ca0ff8327"
          test "$(git hash-object pkg/agent/memory_interaction_security_test.go)" = "fc31087f2f0310ccf1bd11f76dee97b622602e42"
          test "$(git hash-object pkg/channels/telegram/structured_delivery_test.go)" = "d2a46bb2016e9ae99236ef9fc3d2bc1aefaac523"
          test "$(sha256sum .github/pr17-hardening.patch.gz.b64 | awk '{print $1}')" = "0df48e3ad14f896c6e205363e9744788dd85ee55ea9a95fffe0be8122b19aeab"
          base64 -d .github/pr17-hardening.patch.gz.b64 | gzip -d > /tmp/pr17-finalize.patch
          test "$(sha256sum /tmp/pr17-finalize.patch | awk '{print $1}')" = "1b595d7e7beaba5e715a260a3a73c089e1ff3c7fa0756bcf117cd81897b3643a"
          git apply --check /tmp/pr17-finalize.patch
          git apply /tmp/pr17-finalize.patch
          rm .github/pr17-hardening.patch.gz.b64 .github/workflows/pr17-hardening-apply.yml
          gofmt -w \
            pkg/agent/memory_commands.go \
            pkg/agent/memory_interaction_security_test.go \
            pkg/channels/telegram/structured_delivery_test.go
          git diff --check
          test "$(git hash-object pkg/agent/memory_commands.go)" = "4e12d4f04459cb5ab33d86de0a5100cc128ab15f"
          test "$(git hash-object pkg/agent/memory_interaction_security_test.go)" = "8b21431888f7088f4a295e235f71c855d8636c70"
          test "$(git hash-object pkg/channels/telegram/structured_delivery_test.go)" = "bd9e0f7acaec5b1e8282ca950f3d2858cf394928"
      - name: Run focused Go tests
        run: go test -tags goolm,stdjson ./pkg/commands/... ./pkg/channels/telegram/... ./pkg/agent/...
      - name: Run Telegram race regression
        run: go test -race -tags goolm,stdjson ./pkg/channels/telegram/...
      - name: Commit validated finalization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/pr17-hardening.patch.gz.b64
          test ! -e .github/workflows/pr17-hardening-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): finalize private memory interaction hardening"
          git push origin HEAD:feat/telegram-interactive-command-ux
