name: Personalization Audit Fix

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-audit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/personalized-memory-v2-audit
          fetch-depth: 0

      - name: Apply audited fixes
        run: python3 .github/scripts/apply_personalization_audit_fix.py

      - name: Format Go files
        run: |
          gofmt -w \
            pkg/memory/curated_schema.go \
            pkg/memory/curated_store.go \
            pkg/memory/user_profile.go \
            pkg/memory/curated_evidence_test.go \
            pkg/memory/user_profile_test.go \
            pkg/agent/prompt.go \
            pkg/agent/prompt_test.go \
            pkg/agent/definition_test.go \
            pkg/agent/agent_command.go

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit audited source fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pkg/memory/curated_schema.go \
            pkg/memory/curated_store.go \
            pkg/memory/user_profile.go \
            pkg/memory/curated_evidence_test.go \
            pkg/memory/user_profile_test.go \
            pkg/agent/prompt.go \
            pkg/agent/prompt_test.go \
            pkg/agent/definition_test.go \
            pkg/agent/agent_command.go \
            docs/guides/curated-memory.md
          git diff --cached --check
          git commit -m "fix: harden personalized memory invariants"
          git push origin HEAD:fix/personalized-memory-v2-audit
