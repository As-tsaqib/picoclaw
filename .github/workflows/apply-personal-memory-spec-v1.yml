name: Apply personal-memory spec v1

on:
  pull_request:
    branches:
      - feat/personal-agent-memory-spec-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'automation/personal-memory-spec-v1-apply-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout transport PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact lint hardening patch
        shell: bash
        env:
          EXPECTED_MAIN: 31d584912e0d9cac5b3701ea0df210f5d86db23a
          EXPECTED_TARGET: 907f3c673909a14e079606c38f30c48c1bf64d44
          TARGET_BRANCH: feat/personal-agent-memory-spec-v1
        run: |
          set -euo pipefail
          cp .github/personal-memory-spec-v1/lint-fix.patch /tmp/lint-fix.patch
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_TARGET}"
          git switch --detach "${EXPECTED_TARGET}"
          git switch -c personal-memory-lint-hardening
          git apply --check /tmp/lint-fix.patch
          git apply /tmp/lint-fix.patch
          gofmt -w \
            pkg/memory/curated_store.go \
            pkg/memory/curated_store_test.go \
            pkg/memory/curated_typed_retrieval_test.go \
            pkg/tools/memory_manage.go
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "pkg/memory/curated_store.go pkg/memory/curated_store_test.go pkg/memory/curated_typed_retrieval_test.go pkg/tools/memory_manage.go "

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Generate and focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          git diff --check
          go test -tags goolm,stdjson ./pkg/memory/... ./pkg/tools/...

      - name: Golangci lint exact patched tree
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

      - name: Publish lint hardening commit
        shell: bash
        env:
          TARGET_BRANCH: feat/personal-agent-memory-spec-v1
        run: |
          set -euo pipefail
          rm -f -- pkg/beads/beads.go pkg/hooks/hooks.go
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "pkg/memory/curated_store.go pkg/memory/curated_store_test.go pkg/memory/curated_typed_retrieval_test.go pkg/tools/memory_manage.go "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            pkg/memory/curated_store.go \
            pkg/memory/curated_store_test.go \
            pkg/memory/curated_typed_retrieval_test.go \
            pkg/tools/memory_manage.go
          git diff --cached --check
          git commit -m "fix(memory): satisfy static analysis"
          git push origin HEAD:"refs/heads/${TARGET_BRANCH}"
