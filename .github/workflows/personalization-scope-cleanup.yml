name: Personalization Scope Cleanup

on:
  push:
    branches:
      - fix/personalized-memory-v2-audit
    paths:
      - .github/workflows/personalization-scope-cleanup.yml

permissions:
  contents: write

jobs:
  restore-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore unrelated provider file from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- pkg/providers/bedrock/provider_bedrock.go
          git diff --check

      - name: Commit scope cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/personalization-scope-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/providers/bedrock/provider_bedrock.go
          git commit -m "chore: keep personalization hardening scoped"
          git push origin HEAD:fix/personalized-memory-v2-audit
