name: PR16 Final Hardening Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr16-final-hardening-runner.yml
      - .github/scripts/pr16_hardening_runner.py
      - .github/scripts/pr16_fix_extractor.py

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout published feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/native-telegram-capabilities-memory-hardening
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Apply audited hardening
        run: |
          python3 .github/scripts/pr16_fix_extractor.py
          python3 .github/scripts/pr16_hardening_runner.py

      - name: Targeted Go validation
        run: go test ./pkg/bus ./pkg/tools ./pkg/capability ./pkg/channels ./pkg/channels/telegram ./pkg/agent ./pkg/memory ./web/backend/api

      - name: Targeted race validation
        run: go test -race ./pkg/channels ./pkg/channels/telegram ./pkg/memory

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend configuration tests
        working-directory: web/frontend
        run: pnpm test:config

      - name: Frontend browser tests
        working-directory: web/frontend
        run: pnpm exec vitest run src

      - name: Frontend lint
        working-directory: web/frontend
        run: pnpm lint

      - name: Frontend production build
        working-directory: web/frontend
        run: pnpm build

      - name: Commit validated source hardening
        run: |
          set -Eeuo pipefail
          rm -f .github/scripts/pr16_fix_extractor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated source changes to commit"
            exit 1
          fi
          git commit -m "fix: close final native capability and memory hardening gaps"
          git push origin HEAD:feat/native-telegram-capabilities-memory-hardening
