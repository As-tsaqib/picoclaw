          # Preserve migration metadata in the existing mutation engine.
          replace_once(
              "pkg/memory/curated_store.go",
              '''\t\tmutation.Provenance.RecordedAt = now
\t\tprepared = append(prepared, mutation)
''',
              '''\t\tif !mutation.migrationPreserveMetadata || mutation.Provenance.RecordedAt.IsZero() {
